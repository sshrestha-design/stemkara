<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#282D3C" />
      <stop offset="60%" stop-color="#1E222D" />
      <stop offset="100%" stop-color="#15171F" />
    </radialGradient>

    <!-- Linear Gradients for the 4 Musical Stems -->
    <!-- Stem 1: Sky/Cobalt Blue -->
    <linearGradient id="blueRibbon" x1="280" y1="280" x2="740" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="35%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Stem 2: Amber/Gold -->
    <linearGradient id="goldRibbon" x1="300" y1="680" x2="620" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Stem 3: Emerald/Mint -->
    <linearGradient id="greenRibbon" x1="420" y1="320" x2="720" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Stem 4: Fuchsia/Violet -->
    <linearGradient id="magentaRibbon" x1="380" y1="620" x2="660" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="40%" stop-color="#EC4899" />
      <stop offset="75%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="470" y1="480" x2="570" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B5C" />
      <stop offset="100%" stop-color="#FF6347" />
    </linearGradient>

    <!-- Inner Glow & Drop Shadow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B0D13" flood-opacity="0.65" />
    </filter>

    <filter id="playShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF3B5C" flood-opacity="0.45" />
    </filter>

    <clipPath id="squircleClip">
      <rect width="1024" height="1024" rx="224" />
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <g clip-path="url(#squircleClip)">
    <rect width="1024" height="1024" fill="url(#bgGrad)" />

    <!-- Subtle Vignette & Border Rim -->
    <rect width="1024" height="1024" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08" />

    <!-- Center 4-Stem Iris Vortex Group -->
    <g id="vortex" filter="url(#ribbonShadow)">
      <!-- Outer Track Glow Halo -->
      <circle cx="512" cy="510" r="236" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.12" />

      <!-- Ribbon 1: Cyan/Blue Arching Outer Loop -->
      <path d="M 330 380 
               C 390 280, 560 250, 680 320 
               C 760 370, 780 490, 730 580 
               C 690 650, 610 700, 530 720 
               C 440 740, 360 700, 310 630 
               C 275 580, 280 490, 330 420
               C 350 390, 380 370, 420 360
               C 380 375, 340 420, 340 480
               C 340 560, 410 640, 500 655
               C 580 670, 660 625, 695 560
               C 730 495, 715 405, 650 355
               C 555 285, 410 305, 330 380 Z" 
            fill="url(#blueRibbon)" />

      <!-- Ribbon 2: Amber/Gold Sweep -->
      <path d="M 360 640 
               C 310 560, 310 440, 370 360 
               C 430 280, 550 270, 640 320 
               C 600 300, 490 295, 415 350 
               C 350 400, 340 500, 375 580 
               C 410 660, 490 710, 580 700 
               C 660 690, 725 630, 745 550
               C 735 615, 675 675, 595 685
               C 505 695, 415 640, 360 640 Z" 
            fill="url(#goldRibbon)" />

      <!-- Ribbon 3: Emerald/Mint Inner-to-Mid Ring -->
      <path d="M 460 330 
               C 560 330, 655 385, 685 470 
               C 715 555, 675 645, 600 680 
               C 655 645, 685 575, 665 505 
               C 645 435, 575 380, 500 375 
               C 435 370, 380 405, 360 455 
               C 375 410, 415 345, 460 330 Z" 
            fill="url(#greenRibbon)" />

      <!-- Ribbon 4: Fuchsia/Pink Core Spiral Loop -->
      <path d="M 400 480 
               C 400 420, 450 375, 515 375 
               C 585 375, 635 425, 635 495 
               C 635 565, 575 615, 505 615 
               C 440 615, 395 565, 400 500 
               C 405 545, 445 585, 495 585 
               C 545 585, 595 545, 595 490 
               C 595 435, 555 405, 505 405 
               C 455 405, 420 440, 420 480 Z" 
            fill="url(#magentaRibbon)" />
    </g>

    <!-- Center Play Button (Coral Triangle with Rounded Corners) -->
    <path d="M 480 472 
             C 474 468, 468 472, 468 479 
             L 468 541 
             C 468 548, 474 552, 480 548 
             L 562 516 
             C 568 513, 568 507, 562 504 
             Z" 
          fill="url(#playGrad)" 
          filter="url(#playShadow)" />

    <!-- Stemkara Typography -->
    <text x="512" y="888" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="124" 
          font-weight="700" 
          letter-spacing="-1.2" 
          fill="#FFFFFF">Stemkara</text>
  </g>
</svg>
